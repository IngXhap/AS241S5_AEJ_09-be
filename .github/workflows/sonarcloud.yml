name: Backend - SonarCloud Quality Analysis

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
  schedule:
    # Todos los días a las 8:00 AM hora Perú (UTC-5)
    - cron: '0 13 * * *'
  workflow_dispatch:

jobs:
  sonarcloud-analysis:
    name: SonarCloud Code Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Crucial para SonarCloud (necesita ver el historial de Git)

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      # SonarCloud se integra nativamente con Maven usando su plugin oficial
      - name: Analyze with SonarCloud
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Lo da GitHub automáticamente
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}    # El secreto que creaste
        run: |
          mvn verify sonar:sonar \
            -Dsonar.projectKey=roberto_as241s5_aej_09-be \
            -Dsonar.organization=tu_organizacion_sonar \
            -Dsonar.host.url=https://sonarcloud.io
