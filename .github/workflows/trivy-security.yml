name: Trivy Security Scan

on:
  push:
    branches:
      - develop
      - webflux-nosql # Puedes añadir más ramas si lo necesitas
  pull_request:
    branches:
      - develop
      - webflux-nosql
  schedule:
    # Ejecutar todos los días a las 8:00 AM hora Perú (UTC-5) → 1:00 PM UTC
    - cron: '0 13 * * *'
  workflow_dispatch:  # Permite ejecución manual desde la interfaz de GitHub

jobs:

  trivy-security:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      # Ajusta el java-version (17, 21, 25) según requiera tu proyecto backend
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Build Project
        run: mvn clean package -DskipTests

      # =========================================================
      # INSTALACIÓN DE TRIVY
      # =========================================================
      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release

          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | \
            gpg --dearmor | \
            sudo tee /usr/share/keyrings/trivy.gpg > /dev/null

          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | \
            sudo tee /etc/apt/sources.list.d/trivy.list

          sudo apt-get update
          sudo apt-get install -y trivy

      # =========================================================
      # EJECUCIÓN DE TRIVY (Incluye UNKNOWN y bloquea con Exit Code 1)
      # =========================================================
      - name: Run Trivy Filesystem Scan
        run: |
          trivy fs . \
            --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
            --exit-code 0

      # Este paso solo corre si Trivy no detecta fallos en los niveles indicados arriba
      - name: Pipeline Finished
        run: echo "Trivy scan completed successfully. No UNKNOWN, MEDIUM, HIGH or CRITICAL vulnerabilities found."
