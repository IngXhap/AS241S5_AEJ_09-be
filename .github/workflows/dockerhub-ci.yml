name: Docker Hub

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
  schedule:
    # Ejecutar todos los días a las 8:00 AM hora Perú (UTC-5) → 1:00 PM UTC
    - cron: '0 13 * * *'
  workflow_dispatch:  # Permite ejecución manual desde GitHub Actions UI

jobs:
  dockerhub:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout del código
      - name: Checkout Repository
        uses: actions/checkout@v3

      # 2. Login a Docker Hub usando tus secretos personalizados con tu nombre
      - name: Log in to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME_ROBERTO }}
          password: ${{ secrets.DOCKERHUB_TOKEN_ROBERTO }}

      # 3. Build y Push apuntando a tu carpeta específica
      - name: Build and Push Docker Image to Docker Hub
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./dockerfile-roberto/Dockerfile   # Ruta exacta a tu carpeta personalizada
          push: true
          tags: |
            robertoespinoza/as241s5_aej_09-be:latest
            robertoespinoza/as241s5_aej_09-be:${{ github.sha }}