name: Backend - Docker Hub Deploy

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
  schedule:
    # Todos los días a las 8:00 AM hora Perú (UTC-5)
    - cron: '0 13 * * *'
  workflow_dispatch:

jobs:
  dockerhub-deploy:
    name: Build and Push Image
    runs-on: ubuntu-latest

    steps:
      # 1. Clonar el código del Back-End en la máquina virtual
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Iniciar sesión en Docker Hub con tus credenciales personalizadas
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME_ROBERTO }}
          password: ${{ secrets.DOCKERHUB_TOKEN_ROBERTO }}

      # 3. Construir usando tu Dockerfile de Maven multi-etapa y subir la imagen
      - name: Build and Push Docker Image to Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./dockerfile-roberto/Dockerfile  # Ruta de mi DockerFile
          push: true
          tags: |
            robertoespinoza/as241s5_aej_09-be:latest
            robertoespinoza/as241s5_aej_09-be:${{ github.sha }}

      # 4. Confirmación de fin del flujo
      - name: Deploy Finished
        run: echo "Backend image successfully built via Multi-stage (Maven) and pushed to Docker Hub."
